# ==============================================================================
# Alembic configuration — GRYPHON Phase 1
# ==============================================================================
# Alembic is the SOLE production schema migration owner (§22.4). The application
# runtime MUST NOT call metadata.create_all in production.
#
# The sqlalchemy.url below is intentionally left blank: env.py resolves the DSN
# from GRYPHON_MIGRATION_DATABASE_URL (the owner/deploy role) at run time, so no
# credentials live in this file.
# ==============================================================================

[alembic]
script_location = gryphon/db/migrations
prepend_sys_path = .
path_separator = os
# Resolved dynamically in env.py from settings.migration_database_url.
sqlalchemy.url =

# Timezone for migration file timestamps.
timezone = UTC

[post_write_hooks]
# (none)

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
